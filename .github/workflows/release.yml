name: Release PFTD.COM

on:
  workflow_run:
    workflows: ["Test PFTD (MAME)"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POFOSCAB
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download PFTD.COM artifact from the test run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: PFTD-COM
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Skip - not a tag build (PFTD-COM artifact wasn't uploaded)
        if: steps.download.outcome != 'success'
        run: |
          echo "No PFTD-COM artifact on this test run - it wasn't a tag build, nothing to release."
          exit 0

      - name: Package for release
        if: steps.download.outcome == 'success'
        run: zip "PFTD-${{ github.event.workflow_run.head_branch }}.zip" PFTD.COM

      - name: Create GitHub Release
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.workflow_run.head_branch }}" \
            "PFTD-${{ github.event.workflow_run.head_branch }}.zip" \
            --title "${{ github.event.workflow_run.head_branch }}" \
            --generate-notes
